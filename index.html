<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
    <foreignObject width="100%" height="100%">
        <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                <title>天天好料</title>
            </head>
            <style>
                *{
                    margin: 0;
                    padding: 0;
                }
                html, body {
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                #loading {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    font-size: 16px;
                    color: #666;
                    z-index: 999;
                }
                #dynamicIframe {
                    display: none;
                    width: 100%;
                    height: 100%;
                    border: none;
                }
                #dynamicIframe.active {
                    display: block;
                }
            </style>
            <body translate="no">
                <div id="loading">加载中...</div>
                <div id="linkNotice" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;z-index:1000;text-align:center;">
                    <p style="margin:0 0 10px;">原链接已失效，请保存新的分享链接：</p>
                    <input id="newLink" readonly style="width:260px;margin-bottom:10px;" />
                    <button id="copyLink">复制链接</button>
                </div>
                <iframe id="dynamicIframe" src="" width="100%" height="100%" frameborder="0"></iframe>
                <script>
                    // 接口根地址，换环境只改这里
                    const apiBase = 'https://javaapi.tthaol.com';
                    // 获取当前域名和参数
                    const currentDomain = window.location.origin;
                    const currentSearch = window.location.search;
                    console.log(`当前域名: ${currentDomain}`);
                    console.log(`当前参数: ${currentSearch}`);

                    // 解析 URL 参数，提取 token、访问标识、微信授权码与 state
                    function getUrlParams() {
                        const params = new URLSearchParams(currentSearch);
                        return {
                            t: params.get('t') || '',
                            v: params.get('v') || '',
                            accessToken: params.get('accessToken') || '',
                            refreshToken: params.get('refreshToken') || ''
                        };
                    }

                    const urlParams = getUrlParams();
                    console.log(`解析到的参数: t=${urlParams.t}`);

                    // 微信浏览器检测
                    const isWeChatBrowser = /MicroMessenger/i.test(navigator.userAgent);
                    // 渠道类型：微信内核浏览器 wechat_h5，否则 h5
                    const channelType = isWeChatBrowser ? 'wechat_h5' : 'h5';
                    // 授权失败回壳子页时带 oauthFailed=1，按游客继续落地校验，避免没有 token 再次拉起授权
                    const oauthFailed = new URLSearchParams(currentSearch).get('oauthFailed') === '1';

                    // 当前壳子页地址（去掉 token / 授权码），授权结束后回到本页，地址栏不进入平台 H5
                    function buildShellReturnUrl() {
                        const params = new URLSearchParams(currentSearch);
                        params.delete('accessToken');
                        params.delete('refreshToken');
                        params.delete('code');
                        params.delete('state');
                        params.delete('oauthFailed');
                        const qs = params.toString();
                        return currentDomain + window.location.pathname + (qs ? '?' + qs : '');
                    }

                    // 获取 iframe 元素
                    const iframe = document.getElementById('dynamicIframe');
                    const loading = document.getElementById('loading');

                    // 平台 H5 的源站。只接受这个源站的 postMessage，避免其它页面驱动壳子跳转
                    let allowedFrameOrigin = '';

                    // 把壳子页判断出的渠道写进平台 hash。iframe 跨域读不到外层变量，平台从启动参数取 channelType
                    function withChannelType(url) {
                        const parsed = new URL(url, window.location.href);
                        let hashPath = '/';
                        let hashQuery = '';
                        if (parsed.hash && parsed.hash.length > 1) {
                            const raw = parsed.hash.slice(1);
                            const qIdx = raw.indexOf('?');
                            if (qIdx >= 0) {
                                hashPath = raw.slice(0, qIdx) || '/';
                                hashQuery = raw.slice(qIdx + 1);
                            } else {
                                hashPath = raw || '/';
                            }
                        }
                        const params = new URLSearchParams(hashQuery);
                        params.set('channelType', channelType);
                        if (!hashPath.startsWith('/')) {
                            hashPath = '/' + hashPath;
                        }
                        parsed.hash = hashPath + '?' + params.toString();
                        return parsed.toString();
                    }

                    // 显示 iframe 并隐藏 loading（地址栏保持壳子域名，平台 H5 只在 iframe 内打开）
                    function showIframe(url) {
                        const target = withChannelType(url);
                        console.log(`iframe 加载页面: ${target}`);
                        allowedFrameOrigin = new URL(target, window.location.href).origin;
                        iframe.src = target;
                        iframe.classList.add('active');
                        loading.style.display = 'none';
                    }

                    /**
                     * 拼平台跳转地址：参数写入 hash（/#/?...），对齐 uni-app H5 启动解析；
                     * 补登录态；失效域名场景附带新分享链供平台展示。
                     *
                     * @param {string} link 落地校验返回的平台链接
                     * @param {{fromInvalidDomain?: boolean, redirectLink?: string, tenantId?: number|string}} extra 附加参数
                     * @returns {string} 最终跳转 URL
                     */
                    function buildPlatformJumpUrl(link, extra) {
                        const url = new URL(link, window.location.href);
                        // 1. 解析已有 hash query（#/?a=1 或 #/pages/x?a=1）；兼容旧版把参数放在 search 的链接
                        let hashPath = '/';
                        let hashQuery = '';
                        if (url.hash && url.hash.length > 1) {
                            const raw = url.hash.slice(1); // 去掉 #
                            const qIdx = raw.indexOf('?');
                            if (qIdx >= 0) {
                                hashPath = raw.slice(0, qIdx) || '/';
                                hashQuery = raw.slice(qIdx + 1);
                            } else {
                                hashPath = raw || '/';
                            }
                        }
                        const params = new URLSearchParams(hashQuery);
                        url.searchParams.forEach((value, key) => {
                            if (!params.has(key)) {
                                params.set(key, value);
                            }
                        });
                        url.search = '';
                        // 2. 补登录态。场景、模块、目标仍走 /context，不放进地址
                        params.delete('sceneType');
                        params.delete('moduleCode');
                        params.delete('targetId');
                        if (accessToken) {
                            params.set('accessToken', accessToken);
                        }
                        if (refreshToken) {
                            params.set('refreshToken', refreshToken);
                        }
                        // 平台启动时没有租户号会清掉刚写入的登录态。只带落地校验返回的租户号
                        const tenantId = extra && extra.tenantId != null ? String(extra.tenantId).trim() : '';
                        if (/^[1-9]\d*$/.test(tenantId)) {
                            params.set('tenantId', tenantId);
                        }
                        if (extra && extra.fromInvalidDomain && extra.redirectLink) {
                            params.set('fromInvalidDomain', '1');
                            params.set('redirectLink', extra.redirectLink);
                        }
                        if (!hashPath.startsWith('/')) {
                            hashPath = '/' + hashPath;
                        }
                        url.hash = hashPath + '?' + params.toString();
                        return url.toString();
                    }

                    // 壳子页：调后端落地风控校验，通过后在 iframe 打开平台 H5，地址栏保持壳子域名
                    const t = urlParams.t || '';
                    const v = urlParams.v || '';
                    const accessToken = urlParams.accessToken || '';
                    const refreshToken = urlParams.refreshToken || '';
                    let verifyUrl = `${apiBase}/app-api/site/share/land/verify`;

                    console.log(`请求落地风控: ${verifyUrl}`);

                    // 落地风控：通过后 iframe 打开平台。授权地址拿失败时也会走到这里，按游客继续
                    function landVerify() {
                        fetch(verifyUrl, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": "Bearer " + accessToken,
                                "channel-type": channelType,
                            },
                            body: JSON.stringify({ t: t, v: v }),
                        })
                            .then((response) => response.json())
                            .then((res) => {
                                console.log("落地风控返回:", res);
                                // yudao CommonResult：code=0 成功
                                if (res && res.code === 0 && res.data) {
                                    const { pass, interceptUrl, fromInvalidDomain, redirectLink, link, tenantId } = res.data;
                                    if (pass) {
                                        if (!link) {
                                            loading.textContent = "加载失败，请稍后再试。";
                                            return;
                                        }
                                        // 放行：iframe 打开平台；失效域名把新分享链带给平台展示。地址栏仍是壳子域名
                                        const target = buildPlatformJumpUrl(link, {
                                            fromInvalidDomain: !!fromInvalidDomain,
                                            redirectLink: redirectLink || '',
                                            tenantId: tenantId,
                                        });
                                        console.log("iframe 打开平台 H5:", target);
                                        showIframe(target);
                                    } else if (interceptUrl) {
                                        // 拦截：跳拦截博客地址
                                        location.href = interceptUrl;
                                    } else {
                                        loading.textContent = "加载失败，请稍后再试。";
                                    }
                                } else {
                                    loading.textContent = "加载失败，请稍后再试。";
                                }
                            })
                            .catch((err) => {
                                console.error("请求失败：", err);
                                loading.textContent = "加载失败，请检查网络连接。";
                            });
                    }

                    // 1. 微信且还没有登录态：先拿授权地址，成功则顶层去微信，回跳本页后再落地
                    // 2. 授权地址失败：写出原因，按游客落地，避免停在「加载中」
                    if (isWeChatBrowser && !accessToken && !oauthFailed) {
                        const returnUrl = buildShellReturnUrl();
                        fetch(`${apiBase}/app-api/site/share/oauth-jump?type=31&t=${encodeURIComponent(t)}&v=${encodeURIComponent(v)}&returnUrl=${encodeURIComponent(returnUrl)}`, {
                            headers: {
                                "channel-type": channelType,
                            },
                        })
                            .then((response) => response.json())
                            .then((res) => {
                                if (res && res.code === 0 && res.data) {
                                    console.log("跳转微信授权:", res.data);
                                    location.href = res.data;
                                    return;
                                }
                                const msg = (res && res.msg) ? res.msg : "获取微信授权地址失败";
                                console.error("获取微信授权地址失败：", res);
                                loading.textContent = msg;
                                landVerify();
                            })
                            .catch((err) => {
                                console.error("获取微信授权地址失败：", err);
                                loading.textContent = "获取微信授权地址失败，请检查网络连接。";
                                landVerify();
                            });
                    } else {
                        landVerify();
                    }

                    // 复制新分享链接
                    document.getElementById('copyLink').addEventListener('click', function() {
                        const link = document.getElementById('newLink').value;
                        if (!link) return;
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(link).then(() => alert('已复制到剪贴板'));
                        } else {
                            const input = document.getElementById('newLink');
                            input.select();
                            document.execCommand('copy');
                            alert('已复制到剪贴板');
                        }
                    });

                    // 监听 postMessage：iframe 内换页仍留在 iframe；微信授权必须交给顶层窗口，否则微信提示「请在微信客户端打开链接」
                    window.addEventListener("message", function(event) {
                        if (!allowedFrameOrigin || event.origin !== allowedFrameOrigin) {
                            return;
                        }
                        if (!event.data || !event.data.url) {
                            return;
                        }
                        if (event.data.action === "redirect") {
                            console.log(`收到 postMessage 跳转指令，iframe 加载: ${event.data.url}`);
                            showIframe(event.data.url);
                            return;
                        }
                        if (event.data.action === "wechatOAuth") {
                            // 分享链路已把 accessToken 带回壳子。再把顶层窗口送去授权，回来会落在平台登录页，分享页进不去
                            if (accessToken) {
                                console.log("壳子已有登录态，忽略微信授权跳转");
                                return;
                            }
                            let oauthUrl;
                            try {
                                oauthUrl = new URL(event.data.url);
                            } catch (e) {
                                return;
                            }
                            // 只放行微信网页授权，避免平台页把顶层窗口带到其它地址
                            if (oauthUrl.protocol !== 'https:' || oauthUrl.hostname !== 'open.weixin.qq.com') {
                                return;
                            }
                            console.log('顶层窗口打开微信授权:', oauthUrl.toString());
                            location.href = oauthUrl.toString();
                        }
                    });

                </script>
            </body>
        </html>
    </foreignObject>
</svg>
